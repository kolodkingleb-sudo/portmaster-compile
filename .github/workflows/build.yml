name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build EXE for Windows
    runs-on: windows-latest

    env:
      APP_NAME: portmaster-compile

      # Замени на настоящий стартовый файл проекта:
      # main.py, app.py, run.py, src/main.py и т. п.
      ENTRY_POINT: main.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

          python -m pip install pyinstaller

      - name: Validate entry point
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.ENTRY_POINT }}")) {
            Write-Host "ERROR: Entry point not found: ${{ env.ENTRY_POINT }}"
            Write-Host "Edit ENTRY_POINT in .github/workflows/build.yml"
            exit 1
          }

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name "${{ env.APP_NAME }}" `
            "${{ env.ENTRY_POINT }}"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: dist/${{ env.APP_NAME }}.exe
          if-no-files-found: error
          retention-days: 14
